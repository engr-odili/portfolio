[project]
name = "portfolio-cms"
version = "0.1.0"
description = ""
authors = [
    {name = "Chinedum Christian Odili",email = "chodili@student.42luanda.com"}
]
readme = "README.md"
requires-python = ">=3.14, <4.0"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "flask-migrate (>=4.1.0,<5.0.0)",
    "flask-login (>=0.6.3,<0.7.0)",
    "flask-wtf (>=1.3.0,<2.0.0)",
    "flask-babel (>=4.0.0,<5.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "pillow (>=13.0.0,<14.0.0)",
]

[tool.poetry]
packages = [{include = "portfolio_cms", from = "src"}]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-flask (>=1.3.0,<2.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "flake8 (>=7.4.1,<8.0.0)"
]

[tool.black]
line-length = 79
target-version = ["py314"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
